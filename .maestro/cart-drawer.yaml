# Cart drawer: empty state, quantity controls, remove, subtotal, checkout navigation
# Covers: CA-01, CA-02, CA-03, CA-04, CA-05, CA-06, CA-07, CA-08, EC-06
appId: com.example.stackdemo
name: Cart drawer
tags: [smoke, cart]
---
- launchApp:
    clearState: true

# CA-01: empty state
- tapOn: "Cart"
- assertVisible: "Bag"
- assertVisible: 'Add some products in the bag :\)'
- takeScreenshot: cart-empty
- tapOn: "Close cart"

# CA-02: added product appears with qty 1 and price
- tapOn:
    text: "Add to cart"
    index: 0
- tapOn: "Cart"
- assertVisible: "iPhone 12"
- assertVisible: "Apple"
- assertVisible: "SUBTOTAL"
- assertVisible: '\$799\.00'

# CA-03: + doubles quantity and subtotal
- tapOn: "Increase"
- assertVisible:
    text: "2"
- assertVisible: '\$1598\.00'
- takeScreenshot: cart-qty-2

# CA-04: - halves it again
- tapOn: "Decrease"
- assertVisible: '\$799\.00'

# CA-05: - at qty 1 removes the item
- tapOn: "Decrease"
- assertVisible: 'Add some products in the bag :\)'
- tapOn: "Close cart"

# CA-07: two products, subtotal is the sum (799 + 699)
- tapOn:
    text: "Add to cart"
    index: 0
- tapOn:
    text: "Add to cart"
    index: 1
- tapOn: "Cart"
- assertVisible: "iPhone 12 Mini"
- assertVisible: '\$1498\.00'

# CA-06 / EC-06: x removes the first product, second remains, badge drops to 1
- tapOn:
    text: "Remove"
    index: 0
- assertVisible: "iPhone 12 Mini"
- assertVisible: '\$699\.00'
- assertVisible:
    text: "1"
- takeScreenshot: cart-one-removed

# CA-08: CHECKOUT opens the Login screen
- tapOn: "CHECKOUT"
- assertVisible: "Select Username"
- assertVisible: "LOG IN"
