# Sub-flow: fill every shipping field with valid values.
# Expects: Checkout screen visible.
# Fields advance with Enter (IME Next) instead of tapping labels: the small floating
# keyboard toolbar can cover the label centre and swallow the tap.
appId: com.example.stackdemo
---
- assertVisible: "Shipping Address"
- tapOn: "First Name"
- inputText: "Didier"
- pressKey: Enter
- inputText: "Tester"
- pressKey: Enter
- inputText: "123 Main St"
- pressKey: Enter
- inputText: "CA"
- pressKey: Enter
- inputText: "94105"
- pressKey: Enter
