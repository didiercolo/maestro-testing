# Sub-flow: log in through the dropdown selectors.
# Expects: Login screen visible. Env: USERNAME (required; a header default would override the caller).
appId: com.example.stackdemo
---
- assertVisible: "Select Username"
- tapOn: "Select Username"
- tapOn: ${USERNAME}
- tapOn: "Select Password"
- tapOn: "testingisfun99"
- tapOn: "LOG IN"
