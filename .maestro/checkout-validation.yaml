# Checkout: required-field and postal-code validation, order summary total
# Covers: CK-01 .. CK-08, LG-02
appId: com.example.stackdemo
name: Checkout validation
tags: [checkout]
---
- runFlow: flows/launch-app.yaml
- tapOn:
    text: "Add to cart"
    index: 0
- runFlow: flows/open-cart-and-checkout.yaml
- runFlow:
    file: flows/login.yaml
    env:
      USERNAME: demouser

# LG-02 / CK-08: checkout opens with the order summary
- assertVisible: "Shipping Address"
- assertVisible: "Order Summary"
- assertVisible: "iPhone 12"
- assertVisible: '\$799\.00'
- takeScreenshot: checkout-loaded

# CK-07: submitting an empty form flags every field
- tapOn: "SUBMIT"
- assertVisible:
    text: "Required"
    index: 4
- assertVisible: "Shipping Address"
- takeScreenshot: checkout-required-errors

# CK-06: non-numeric postal code
- tapOn: "First Name"
- inputText: "Didier"
- pressKey: Enter
- inputText: "Tester"
- pressKey: Enter
- inputText: "123 Main St"
- pressKey: Enter
- inputText: "CA"
- pressKey: Enter
- inputText: "abc"
- pressKey: Enter
- tapOn: "SUBMIT"
- assertVisible: "Enter a valid postal code"
- assertNotVisible: "Your Order has been successfully placed."
- takeScreenshot: checkout-postal-error
